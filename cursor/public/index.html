<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QuickCart</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; }
    .product { border: 1px solid #ddd; padding: 1rem; margin: .5rem 0; border-radius: 8px; }
    .review { background: #f6f6f6; padding: .5rem; margin: .25rem 0; border-radius: 6px; }
    input, button { padding: .4rem; }
  </style>
</head>
<body>
  <h1>QuickCart</h1>

  <section>
    <input id="search" placeholder="Search products..." />
    <button onclick="search()">Search</button>
  </section>

  <div id="products"></div>

  <h2>Reviews</h2>
  <div>
    <input id="reviewProduct" placeholder="Product ID" />
    <div id="reviews"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
